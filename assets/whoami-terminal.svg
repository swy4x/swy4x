<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101713"/>
      <stop offset="1" stop-color="#070b09"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="756" height="226" rx="16" fill="url(#bg)" stroke="#1e3a2b" stroke-width="2"/>
  <path d="M2 54H758" stroke="#1e3a2b" stroke-width="2"/>
  <circle cx="28" cy="28" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="28" r="6" fill="#febc2e"/>
  <circle cx="72" cy="28" r="6" fill="#28c840"/>
  <text x="380" y="33" text-anchor="middle" fill="#789184" font-family="monospace" font-size="13">swy4x@archlinux: ~</text>
  <text x="42" y="111" fill="#00ff88" font-family="monospace" font-size="22">$</text>
  <text x="68" y="111" fill="#d8e5dc" font-family="monospace" font-size="22">whoami</text>
  <text x="42" y="166" fill="#00ff88" font-family="monospace" font-size="27" filter="url(#glow)">&gt;</text>
  <svg x="75" y="135" width="250" height="45" viewBox="0 0 250 45">
    <text x="0" y="32" fill="#00ff88" font-family="monospace" font-size="30" font-weight="600" class="name">Swayam</text>
    <rect x="126" y="7" width="3" height="29" fill="#00ff88" class="cursor"/>
  </svg>
  <style>
    .name { clip-path: inset(0 100% 0 0); animation: type 2s steps(6,end) 0.8s forwards; }
    .cursor { opacity: 1; animation: blink .8s steps(2,start) infinite; }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</svg>