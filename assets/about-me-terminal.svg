<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090d0b"/><stop offset="1" stop-color="#101a14"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono{font-family:'Fira Code','Courier New',monospace}
      .green{fill:#00ff88}
      .dim{fill:#719781}
      .line{opacity:0;animation:show .35s ease forwards}
      .l1{animation-delay:.5s}.l2{animation-delay:1.05s}.l3{animation-delay:1.6s}.l4{animation-delay:2.15s}.l5{animation-delay:2.7s}.l6{animation-delay:3.25s}.l7{animation-delay:3.8s}
      .cursor{animation:blink 1s steps(2,start) infinite}
      @keyframes show{to{opacity:1}}
      @keyframes blink{to{opacity:0}}
    </style>
  </defs>
  <rect x="2" y="2" width="896" height="326" rx="13" fill="url(#bg)" stroke="#00ff88" stroke-opacity=".48" stroke-width="2"/>
  <path d="M2 47H898" stroke="#244b36"/>
  <circle cx="25" cy="25" r="6" fill="#ff5f56"/><circle cx="46" cy="25" r="6" fill="#ffbd2e"/><circle cx="67" cy="25" r="6" fill="#27c93f"/>
  <text x="450" y="30" text-anchor="middle" class="mono dim" font-size="14">swayam@cyber-space: ~</text>
  <g class="mono" font-size="20">
    <text x="35" y="83" class="green" filter="url(#glow)">$ cat about_me.txt</text>
    <text x="35" y="121" class="line l1 green">Hey, I'm Swayam.</text>
    <text x="35" y="158" class="line l2">Cybersecurity enthusiast interested in:</text>
    <text x="55" y="195" class="line l3 green">&gt; Blue Team operations &amp; SOC analysis</text>
    <text x="55" y="229" class="line l4 green">&gt; Web security</text>
    <text x="35" y="270" class="line l5 dim">Currently learning:</text>
    <text x="55" y="303" class="line l6 green">&gt; Networking · Linux · Python · Security tools</text>
  </g>
  <rect x="573" y="287" width="12" height="20" rx="1" class="green cursor"/>
</svg>